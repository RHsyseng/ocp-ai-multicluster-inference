---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-operators-deployment
  namespace: openshift-gitops
spec:
  destination:
    name: ''
    namespace: ''
    server: 'https://kubernetes.default.svc'
  source:
    path: lab-materials/hub-config/operators-deployment
    repoURL: 'http://infra.grid.lab:3000/student/ocp-ai-multicluster-inference.git'
    targetRevision: lab-3.6
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 1
        maxDuration: 3m0s
      limit: 1000
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-operators-config
  namespace: openshift-gitops
spec:
  destination:
    name: ''
    namespace: ''
    server: 'https://kubernetes.default.svc'
  source:
    path: lab-materials/hub-config/operators-config
    repoURL: 'http://infra.grid.lab:3000/student/ocp-ai-multicluster-inference.git'
    targetRevision: lab-3.6
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 1
        maxDuration: 3m0s
      limit: 1000
