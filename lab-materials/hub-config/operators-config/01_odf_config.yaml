apiVersion: ocs.openshift.io/v1
kind: StorageCluster
metadata:
  name: ocs-storagecluster
  namespace: openshift-storage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  enableCephTools: true
  arbiter: {}
  encryption:
    keyRotation:
      schedule: '@weekly'
    kms: {}
  externalStorage: {}
  flexibleScaling: true
  managedResources:
    cephBlockPools:
      defaultStorageClass: true
      defaultVirtualizationStorageClass: true
    cephCluster:
      cleanupPolicy:
        # Wipe bluestore from previous cluster
        wipeDevicesFromOtherClusters: true
    cephConfig: {}
    cephDashboard: {}
    cephFilesystems: {}
    cephNonResilientPools: {}
    cephObjectStoreUsers: {}
    cephObjectStores: {}
    cephRBDMirror: {}
    cephToolbox: {}
  monDataDirHostPath: /var/lib/rook
  network:
    connections:
      encryption: {}
    multiClusterService: {}
  nodeTopologies: {}
  resourceProfile: balanced
  storageDeviceSets:
  - config: {}
    count: 3
    dataPVCTemplate:
      metadata: {}
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: "1"
        storageClassName: localblock
        volumeMode: Block
      status: {}
    name: ocs-deviceset-localblock
    placement: {}
    preparePlacement: {}
    replica: 1
    resources:
      requests:
        cpu: "1m"
        memory: 1Mi
  resources:
    mgr:
      requests:
        cpu: "1m"
        memory: 1Mi
    mds:
      requests:
        cpu: "1m"
        memory: 1Mi
    mon:
      requests:
        cpu: "1m"
        memory: 1Mi
    rgw:
      requests:
        cpu: "1m"
        memory: 1Mi
    noobaa-core:
      requests:
        cpu: "1m"
        memory: 1Mi
    noobaa-db:
      requests:
        cpu: "1m"
        memory: 1Mi
    noobaa-db-vol:
      requests:
        storage: 30Gi
    noobaa-endpoint:
      requests:
        cpu: "1m"
        memory: 1Mi
